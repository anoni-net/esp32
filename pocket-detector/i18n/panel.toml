en = '''With no alert, adds a marker. With an alert, acknowledges it. It runs 0.35 seconds after release, and the marker uses the moment you pressed. During a room check it cancels the check. When the light flashes purple it confirms: allowing a firmware update, or turning on auto update or test builds'''

