cn = '''开始寻找触发警报的追踪器，没有警报时找信号最强的。越近哔得越快、指示灯闪得越快，寻找中再双击就结束'''
en = '''Starts finding the tracker in alert, or the strongest signal if there is no alert. The closer you get, the faster it beeps and the light flashes. Double press again while finding to stop'''

