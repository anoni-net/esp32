[[s]]
tw = '''停留約 5 分鐘以上的地方才會存起來，最多 32 個，滿了先移除最久沒去、沒有命名的。偵測器只存基地台的雜湊，不能直接拿去基地台資料庫查詢，但取得偵測器的人仍可能比對公開的基地台清單推出位置。名稱存在偵測器上，會出現在警示歷史與摘要，不寫進 flash 記錄'''
cn = '''停留约 5 分钟以上的地方才会保存，最多 32 个，满了先移除最久没去、没有命名的。探测器只保存接入点的哈希值，不能直接拿去接入点数据库查询，但拿到探测器的人仍可能比对公开的接入点列表推算出位置。名称保存在探测器上，会出现在警报历史与摘要，不写进 flash 记录'''
en = '''Only places where you stay about 5 minutes or longer are saved, up to 32. When full, the unnamed place visited least recently is removed first. The detector stores only hashes of access points, which cannot be looked up directly in an access point database, but someone who gets the detector could still compare them with public access point lists to work out locations. Names are stored on the detector and appear in the alert history and summary, but are not written to the flash log'''

