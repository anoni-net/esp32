tw = '''追蹤器 30 分鐘沒出現會從「附近的追蹤器」移除，這裡保留整次開機的紀錄。紀錄也存在偵測器的 flash，重新開機（例如接上電腦讀資料）後，到上方切換之前的開機查看，最多保留 8 次。'''
cn = '''追踪器 30 分钟没出现会从“附近的追踪器”移除，这里保留整次开机的记录。记录也存在探测器的 flash，重新开机（例如接上电脑读取数据）后，到上方切换到之前的开机查看，最多保留 8 次。'''
en = '''Trackers not seen for 30 minutes are removed from “Nearby trackers”, but this list keeps the whole session. The record is also saved in the detector’s flash. After a restart (for example, after connecting it to a computer to read data), switch to an earlier session above to view it. Up to 8 sessions are kept.'''

