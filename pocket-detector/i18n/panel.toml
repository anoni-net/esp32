tw = '''會議室檢查'''
cn = '''会议室检查'''
en = '''Meeting room check'''

[[s]]
tw = '''收走手機之後，監看房間裡有沒有還開著藍牙或 Wi-Fi 的裝置。開始後 2 分鐘建立基準，記下隔壁、走廊與房間裡固定的設備。之後基準之外出現訊號夠強的藍牙裝置就在這裡提醒，近距離有裝置在找 Wi-Fi 時標成留意。偵測器不出聲、不亮警示燈。只開行動網路、Wi-Fi 與藍牙都關掉的手機偵測不到，沒有無線功能的錄音設備也偵測不到。'''
cn = '''收走手机之后，监测房间里有没有仍开着蓝牙或 Wi-Fi 的设备。开始后 2 分钟建立基准，记下隔壁、走廊与房间里固定的设备。之后基准之外出现信号够强的蓝牙设备就在这里提醒，近距离有设备在搜索 Wi-Fi 时标为留意。探测器不出声、不亮警报灯。只开移动数据、Wi-Fi 与蓝牙都关掉的手机探测不到，没有无线功能的录音设备也探测不到。'''
en = '''After phones are collected, this watches the room for devices that still have Bluetooth or Wi-Fi on. The first 2 minutes build a baseline of fixed devices next door, in the hallway and in the room. After that, any Bluetooth device outside the baseline with a strong enough signal is reported here, and nearby devices searching for Wi-Fi are marked for a closer look. The detector makes no sound and the alert light stays off. Phones with only mobile data on and Wi-Fi and Bluetooth off cannot be detected, and neither can recorders without wireless features.'''

[[s]]
tw = '''範圍'''
cn = '''范围'''
en = '''Range'''

[[s]]
tw = '''開始檢查'''
cn = '''开始检查'''
en = '''Start check'''

[[s]]
tw = '''房間檢查'''
cn = '''房间检查'''
en = '''Room check'''

[[s]]
tw = '''住旅館、民宿時，進房間先檢查一遍：列出附近的 Wi-Fi 與藍牙裝置，標出可能是攝影機的裝置與判斷理由。整個檢查約 2 分鐘，開始 15 秒後熱點會關閉、手機會斷線，追蹤器偵測也暫停。燈號從白色呼吸變成綠色連閃兩下就是完成，再到手機的 Wi-Fi 設定連回熱點看報告。短按 BOOT 可以中途取消。'''
cn = '''住酒店、民宿时，进房间先检查一遍：列出附近的 Wi-Fi 与蓝牙设备，标出可能是摄像头的设备与判断理由。整个检查约 2 分钟，开始 15 秒后热点会关闭、手机会断开连接，追踪器探测也暂停。指示灯从白色呼吸变成绿色连闪两下就是完成，再到手机的 Wi-Fi 设置重新连接热点查看报告。短按 BOOT 可以中途取消。'''
en = '''When staying at a hotel or guesthouse, check the room when you arrive: it lists nearby Wi-Fi and Bluetooth devices and marks the ones that may be cameras, with the reasons. The check takes about 2 minutes. 15 seconds after it starts, the hotspot turns off, your phone disconnects and tracker detection pauses. When the light changes from white breathing to two green flashes, it is done. Then reconnect to the hotspot in your phone’s Wi-Fi settings to see the report. Short press BOOT to cancel at any time.'''

[[s]]
tw = '''檢查結果'''
cn = '''检查结果'''
en = '''Results'''

[[s]]
tw = '''還沒有檢查過'''
cn = '''还没有检查过'''
en = '''Not checked yet'''

[[s]]
tw = '''怎麼找、找到之後怎麼做'''
cn = '''怎么找，找到之后怎么做'''
en = '''How to search, and what to do if you find one'''

[[s]]
tw = '''按裝置旁的「尋找」，拿著偵測器在房間裡慢慢走，數字越接近 0 越近，偵測器的嗶聲與燈號也會越來越快。Wi-Fi 裝置要正在傳資料，才能收到它的訊號。'''
cn = '''按设备旁的“寻找”，拿着探测器在房间里慢慢走，数字越接近 0 越近，探测器的哔声与指示灯也会越来越快。Wi-Fi 设备要正在传输数据，才能收到它的信号。'''
en = '''Tap “Find” next to a device and walk slowly around the room with the detector. The closer the number is to 0, the closer you are, and the detector’s beeps and light get faster. A Wi-Fi device must be sending data for its signal to be picked up.'''

[[s]]
tw = '''攝影機常藏在煙霧偵測器、時鐘、充電器、延長線、面紙盒、電視盒、冷氣與喇叭的開孔，特別留意對著床、浴室與衣櫃的位置。'''
cn = '''摄像头常藏在烟雾探测器、时钟、充电器、插线板、纸巾盒、电视盒子、空调与音箱的开孔，特别留意对着床、浴室与衣柜的位置。'''
en = '''Cameras are often hidden in smoke detectors, clocks, chargers, power strips, tissue boxes, TV boxes, and the openings of air conditioners and speakers. Pay special attention to spots facing the bed, bathroom and closet.'''

[[s]]
tw = '''關燈後，手電筒貼近眼睛的高度慢慢掃過可疑的地方，鏡頭會反射出一個小亮點。'''
cn = '''关灯后，把手电筒贴近眼睛的高度慢慢扫过可疑的地方，镜头会反射出一个小亮点。'''
en = '''With the lights off, hold a flashlight at eye level and slowly sweep it over suspicious spots. A lens reflects a small bright dot.'''

[[s]]
tw = '''找到之後不要拆開或丟掉，先拍照記下位置，再聯絡業者或報警。不放心的話換房間，或改用別的住宿。'''
cn = '''找到之后不要拆开或丢掉，先拍照记下位置，再联系经营者或报警。不放心的话换房间，或改住别的地方。'''
en = '''If you find one, do not take it apart or throw it away. Photograph it and note where it is, then contact the operator or the police. If you still feel unsafe, change rooms or stay somewhere else.'''

[[s]]
tw = '''列出的裝置不一定是攝影機，訊號強也可能只是隔壁的智慧家電。'''
cn = '''列出的设备不一定是摄像头，信号强也可能只是隔壁的智能家电。'''
en = '''A listed device is not necessarily a camera. A strong signal may just be a smart appliance next door.'''

[[s]]
tw = '''能找到與找不到的'''
cn = '''能找到与找不到的'''
en = '''What it can and cannot find'''

[[s]]
tw = '''只能找到使用無線網路的攝影機。接網路線、只錄在記憶卡、或關著 Wi-Fi 的找不到。'''
cn = '''只能找到使用无线网络的摄像头。接网线、只录在存储卡、或关着 Wi-Fi 的找不到。'''
en = '''It only finds cameras that use wireless networks. Cameras on a network cable, recording only to a memory card, or with Wi-Fi off cannot be found.'''

[[s]]
tw = '''偵測器只能接收 2.4 GHz，只用 5 GHz 的裝置不會出現。'''
cn = '''探测器只能接收 2.4 GHz，只用 5 GHz 的设备不会出现。'''
en = '''The detector only receives 2.4 GHz. Devices that use only 5 GHz will not appear.'''

[[s]]
tw = '''很多攝影機只在偵測到動作、或有人在看的時候才上傳。檢查時沒在上傳的，只能靠廠商與名稱判斷。'''
cn = '''很多摄像头只在探测到动作、或有人在看的时候才上传。检查时没在上传的，只能靠厂商与名称判断。'''
en = '''Many cameras upload only when they detect motion or someone is watching. Those not uploading during the check can only be judged by maker and name.'''

[[s]]
tw = '''新的手機、筆電常用的高速傳輸模式（Wi-Fi 6、兩支天線同時傳）偵測器解不開，這類裝置的上傳量會算少。'''
cn = '''新的手机、笔记本电脑常用的高速传输模式（Wi-Fi 6、两根天线同时传输）探测器无法解析，这类设备的上传量会算少。'''
en = '''The detector cannot decode the high-speed modes common on newer phones and laptops (Wi-Fi 6, two antennas sending at once), so their upload volume is undercounted.'''

[[s]]
tw = '''隔壁房間、走廊的裝置也會列出來。訊號強度越接近 0（例如 -45 dBm）代表越近。'''
cn = '''隔壁房间、走廊的设备也会列出来。信号强度越接近 0（例如 -45 dBm）代表越近。'''
en = '''Devices in the next room or the hallway are listed too. The closer the signal strength is to 0 (e.g. -45 dBm), the closer the device.'''

[[s]]
tw = '''廠商的比對來自 IEEE 與藍牙 SIG 公開的登記資料，比對到的不一定是攝影機，改過位址或名稱的裝置也比對不出來。'''
cn = '''厂商的比对来自 IEEE 与蓝牙 SIG 公开的登记数据，比对到的不一定是摄像头，改过地址或名称的设备也比对不出来。'''
en = '''Makers are matched against public IEEE and Bluetooth SIG registration data. A match is not necessarily a camera, and devices with a changed address or name cannot be matched.'''

[[s]]
tw = '''找到可疑的裝置，先拍照記下位置，不要自行拆除，聯絡業者或報警處理。'''
cn = '''找到可疑的设备，先拍照记下位置，不要自行拆除，联系经营者或报警处理。'''
en = '''If you find a suspicious device, photograph it and note where it is. Do not remove it yourself. Contact the operator or the police.'''

[[s]]
tw = '''記錄裝置的位址'''
cn = '''记录设备的地址'''
en = '''Log device addresses'''

[[s]]
tw = '''監聽會收到同住的人、隔壁房客手機的 MAC 位址。報告只顯示廠商、名稱與判斷理由，打開這個選項才把位址寫進 flash 記錄'''
cn = '''监听会收到同住的人、隔壁房客手机的 MAC 地址。报告只显示厂商、名称与判断理由，打开这个选项才把地址写进 flash 记录'''
en = '''Listening picks up the MAC addresses of phones belonging to people you are staying with and guests next door. The report shows only maker, name and reasons. Turn this on to also write the addresses to the flash log'''

[[s]]
tw = '''周圍手機洩漏的 Wi-Fi 名稱'''
cn = '''周围手机泄露的 Wi-Fi 名称'''
en = '''Wi-Fi names leaked by nearby phones'''

[[s]]
tw = '''手機找 Wi-Fi 時會送出探測請求，有些會直接問存過的網路，名稱（家、公司、住過的旅館）就跟著送出來，附近的人都收得到。這裡統計這個空間有多少這樣的資訊：監聽 5 分鐘，熱點與面板照常可以用。位址只在偵測器的記憶體裡計數，名稱只顯示在這裡，都不寫進記錄。停止後結果留在這裡，下次開始或重新開機時清除。'''
cn = '''手机搜索 Wi-Fi 时会发出探测请求，有些会直接询问保存过的网络，名称（家、公司、住过的酒店）就跟着发出去，附近的人都收得到。这里统计这个空间有多少这样的信息：监听 5 分钟，热点与面板照常可以使用。地址只在探测器的内存里计数，名称只显示在这里，都不写进记录。停止后结果留在这里，下次开始或重新开机时清除。'''
en = '''When phones look for Wi-Fi they send probe requests. Some ask for saved networks by name, so the names (home, work, hotels you stayed at) go out with them, and anyone nearby can receive them. This counts how much of that information is in this space: it listens for 5 minutes, and the hotspot and panel keep working. Addresses are only counted in the detector’s memory and names are only shown here. Neither is written to the log. Results stay here after stopping and are cleared on the next start or restart.'''

[[s]]
tw = '''開始監聽'''
cn = '''开始监听'''
en = '''Start listening'''

[[s]]
tw = '''為什麼手機會送出這些名稱？怎麼關掉？'''
cn = '''为什么手机会发出这些名称？怎么关掉？'''
en = '''Why do phones send these names? How do I stop it?'''

[[s]]
tw = '''手機想快點找到認識的網路，會送出「附近有誰」的探測請求。大部分的請求不帶名稱，下面三種情況會把名稱說出來，附近的人都收得到：'''
cn = '''手机想快点找到认识的网络，会发出“附近有谁”的探测请求。大部分请求不带名称，下面三种情况会把名称说出来，附近的人都收得到：'''
en = '''To find known networks faster, phones send probe requests asking “who’s nearby?”. Most requests carry no name, but in these three cases the name is sent, and anyone nearby can receive it:'''

[[s]]
tw = '''隱藏名稱的網路'''
cn = '''隐藏名称的网络'''
en = '''Networks with a hidden name'''

[[s]]
tw = '''：基地台不廣播名稱，手機只能說出名稱來找它。把 Wi-Fi 設成隱藏，反而讓手機走到哪裡都說出這個名稱'''
cn = '''：接入点不广播名称，手机只能说出名称来找它。把 Wi-Fi 设成隐藏，反而让手机走到哪里都说出这个名称'''
en = ''': the access point does not broadcast its name, so the phone has to say the name to find it. Hiding your Wi-Fi actually makes your phone announce the name wherever it goes'''

[[s]]
tw = '''舊的系統與部分裝置'''
cn = '''旧的系统与部分设备'''
en = '''Older systems and some devices'''

[[s]]
tw = '''：舊版的 Android、Windows、一些筆電與智慧家電，會把存過的網路一個一個問過去'''
cn = '''：旧版的 Android、Windows、一些笔记本电脑与智能家电，会把保存过的网络一个一个问过去'''
en = ''': older Android and Windows versions, some laptops and smart appliances ask for every saved network one by one'''

[[s]]
tw = '''剛用過的網路'''
cn = '''刚用过的网络'''
en = '''Recently used networks'''

[[s]]
tw = '''：有些系統為了快點連回去，直接問上一個連過的網路'''
cn = '''：有些系统为了快点连回去，直接询问上一个连接过的网络'''
en = ''': some systems ask directly for the last network they joined, to reconnect faster'''

[[s]]
tw = '''從名稱可以猜出住處、公司與去過的旅館，也有人會架一個同名的基地台，等手機自動連上。可以這樣減少：'''
cn = '''从名称可以猜出住处、公司与去过的酒店，也有人会架设一个同名的接入点，等手机自动连上。可以这样减少：'''
en = '''Names can reveal where you live, work and which hotels you stayed at. Some people also set up an access point with the same name and wait for phones to join automatically. You can reduce this:'''

[[s]]
tw = '''家裡、辦公室的 Wi-Fi 不要隱藏名稱，已經隱藏的到路由器的設定改回公開'''
cn = '''家里、办公室的 Wi-Fi 不要隐藏名称，已经隐藏的到路由器的设置改回公开'''
en = '''Do not hide the name of your home or office Wi-Fi. If it is hidden, make it visible again in the router settings'''

[[s]]
tw = '''刪除用不到的網路（住過的旅館、咖啡店、以前的公司），也就不會自動連上同名的基地台'''
cn = '''删除用不到的网络（住过的酒店、咖啡店、以前的公司），也就不会自动连上同名的接入点'''
en = '''Delete networks you no longer use (past hotels, cafes, former workplaces) so your phone won’t join an access point with the same name'''

[[s]]
tw = '''不常用的網路關掉自動加入。iPhone 在 Wi-Fi 設定點進那個網路，關閉「自動加入」'''
cn = '''不常用的网络关掉自动加入。iPhone 在 Wi-Fi 设置点进那个网络，关闭“自动加入”'''
en = '''Turn off auto-join for networks you rarely use. On iPhone, tap the network in Wi-Fi settings and turn off “Auto-Join”'''

[[s]]
