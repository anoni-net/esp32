[[s]]
tw = '''打開時要短按偵測器的 BOOT 鍵確認，之後更新不必再按：偵測器每 6 小時被動掃描一次，附近有更新用的 Wi-Fi 才連上 assets.anoni.net，有比較新的版本就下載，SHA-256 相符才換上並重新開機。有警示、追蹤器快達到門檻、房間檢查、尋找中或手機連著熱點時延後。上傳檔案仍要按 BOOT'''
cn = '''打开时要短按探测器的 BOOT 键确认，之后更新不必再按：探测器每 6 小时被动扫描一次，附近有更新用的 Wi-Fi 才连上 assets.anoni.net，有比较新的版本就下载，SHA-256 相符才换上并重新开机。有警报、追踪器快达到阈值、房间检查、寻找中或手机连着热点时延后。上传文件仍要按 BOOT'''
en = '''Turning it on needs a short press of the detector’s BOOT button. After that, updates need no press: every 6 hours the detector scans passively, connects to assets.anoni.net only when the update Wi-Fi is nearby, downloads any newer version, and installs it and restarts only if the SHA-256 matches. It waits while there is an alert, a tracker is close to the threshold, a room check or find is running, or a phone is on the hotspot. Uploading a file still needs BOOT'''

