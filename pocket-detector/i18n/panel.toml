[[s]]
tw = '''- 偵測器只被動接收藍牙廣播，辨識 Apple Find My、Samsung SmartTag、Tile、Google 尋找我的裝置、Chipolo、Pebblebee 的配件，以及支援 DULT 規格（Apple 與 Google 共同提出的防止不當追蹤規格）的追蹤器'''
cn = '''- 探测器只被动接收蓝牙广播，识别 Apple Find My、Samsung SmartTag、Tile、Google 查找我的设备、Chipolo、Pebblebee 的配件，以及支持 DULT 规范（Apple 与 Google 共同提出的防止不当追踪规范）的追踪器'''
en = '''- The detector only passively receives Bluetooth advertisements. It recognizes Apple Find My, Samsung SmartTag, Tile, Google Find Hub, Chipolo and Pebblebee accessories, plus trackers that support DULT (a specification from Apple and Google against unwanted tracking)'''

[[s]]
tw = '''- 與主人分開的 AirPods 也使用 Find My 的廣播格式，會被列入。Tile、Chipolo、Pebblebee 的廣播不標示是否與主人分開，主人帶在身上的也可能被列入'''
cn = '''- 与主人分开的 AirPods 也使用 Find My 的广播格式，会被列入。Tile、Chipolo、Pebblebee 的广播不标示是否与主人分开，主人带在身上的也可能被列入'''
en = '''- AirPods separated from their owner use the same Find My advertisement format and are listed too. Tile, Chipolo and Pebblebee advertisements don’t show whether they are separated from the owner, so ones the owner is carrying may also be listed'''

[[s]]
tw = '''- iPhone、iPad、Mac 等 Apple 自家裝置與主人分開時也會發送同樣的廣播，'''
cn = '''- iPhone、iPad、Mac 等 Apple 自家设备与主人分开时也会发送同样的广播，'''
en = '''- Apple’s own devices such as iPhone, iPad and Mac send the same advertisement when separated from their owner, '''

[[s]]
tw = '''只有跟著經過好幾個地點才列入'''
cn = '''只有跟着经过好几个地点才列入'''
en = '''they are listed only if they follow you through several places'''

[[s]]
tw = '''沒有列入'''
cn = '''没有列入'''
en = '''they are not listed'''

[[s]]
tw = '''地點的變化是用周圍 Wi-Fi 基地台推算的，不是 GPS'''
cn = '''地点的变化是根据周围的 Wi-Fi 接入点推算的，不是 GPS'''
en = '''Place changes are estimated from nearby Wi-Fi access points, not GPS'''

[[s]]
tw = '''偵測器沒有 GPS，無法分辨追蹤器跟著你移動，還是你待在追蹤器附近（例如住家、辦公室、同一班車上的其他乘客）'''
cn = '''探测器没有 GPS，无法分辨是追踪器跟着你移动，还是你待在追踪器附近（例如家里、办公室、同一班车上的其他乘客）'''
en = '''The detector has no GPS, so it can’t tell whether a tracker is moving with you or you are staying near it (for example at home, at the office, or near other passengers on the same bus or train)'''

[[s]]
tw = '''- 藍牙廣播沒有經過認證，任何裝置都可以假裝成某種追蹤器。位址是藍牙廣播用的位址，不代表追蹤器的序號或擁有者'''
cn = '''- 蓝牙广播没有经过认证，任何设备都可以伪装成某种追踪器。地址是蓝牙广播使用的地址，不代表追踪器的序列号或拥有者'''
en = '''- Bluetooth advertisements are not authenticated, so any device can pretend to be a tracker. The address is the one used in the Bluetooth advertisement and does not reveal the tracker’s serial number or owner'''

[[s]]
tw = '''- 這份摘要只涵蓋同一次開機的紀錄，偵測器的 flash 另外保留最近 8 次開機的警示歷史。開啟 flash 記錄時，完整的原始紀錄另外存在偵測器上'''
cn = '''- 这份摘要只包含同一次开机的记录，探测器的 flash 另外保留最近 8 次开机的警报历史。打开 flash 记录时，完整的原始记录另外保存在探测器上'''
en = '''- This summary covers one session only. The detector’s flash also keeps the alert history of the last 8 sessions. When the flash log is on, the full raw log is also stored on the detector'''

