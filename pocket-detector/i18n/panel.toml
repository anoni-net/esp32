[[s]]
tw = '''：除了跟著你的追蹤器，附近與主人分開的 DULT 追蹤器在很近的距離（訊號強於 -70 dBm）出現超過 10 分鐘，也會讓它響一次，幫帶著它的人發現。會響的只有主人手機不在旁邊的追蹤器，但聽到聲音的人不一定知道原因，也可能只是借來的東西，或主人的手機剛好沒電。等於由你替旁人決定讓他的包包響起來，請確認了解再開啟。'''
cn = '''：除了跟着你的追踪器，附近与主人分开的 DULT 追踪器在很近的距离（信号强于 -70 dBm）出现超过 10 分钟，也会让它响一次，帮带着它的人发现。会响的只有主人手机不在旁边的追踪器，但听到声音的人不一定知道原因，也可能只是借来的东西，或主人的手机刚好没电。这等于由你替旁人决定让他的包响起来，请确认了解后再开启。'''
en = ''': besides trackers following you, a DULT tracker nearby that is separated from its owner and stays very close (signal stronger than -70 dBm) for more than 10 minutes is also made to ring once, so the person carrying it notices. Only trackers whose owner’s phone is not nearby will ring, but the person who hears it may not know why, and it may just be something borrowed, or the owner’s phone may have run out of battery. You are deciding for someone else to make their bag ring, so make sure you understand this before turning it on.'''

