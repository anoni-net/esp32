cn = '''测试版是每次修改都发布、还没经过实机测试的版本，给开发测试用的探测器使用。实机测试通过的版本才会复制到正式版。一般使用请保持关闭。打开时要短按探测器的 BOOT 键确认'''
en = '''Test builds are published after every change and have not been tested on real hardware. They are meant for detectors used in development. Only builds that pass hardware testing are copied to the stable channel. Keep this off for normal use. Turning it on requires a short press of the detector’s BOOT button to confirm'''

