cn = '''扫描周围的 Wi-Fi 接入点判断你换了地点，追踪器要跟着你经过 3 个不同的地点才触发警报。停留在家里、办公室时，周围的追踪器不会再造成误报'''
en = '''Scans nearby Wi-Fi access points to tell when you change place. A tracker must follow you through 3 different places before an alert. While you stay at home or the office, nearby trackers no longer cause false alerts'''

