cn = '''名称、密码、阈值、保存过的地点与所有设置恢复为默认值。flash 记录与警报历史保留，但警报历史里的地点名称会清除。忘记密码时，也可以长按 BOOT 10 秒，指示灯快闪白色后松开'''
