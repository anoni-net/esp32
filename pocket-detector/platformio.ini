; 隨身偵測器。用 Arduino IDE 開啟 pocket_detector/pocket_detector.ino 時，
; 要先把 repo 根目錄 lib/ 底下的資料夾複製到 Arduino 的 libraries 資料夾（見 README）
[platformio]
src_dir = pocket_detector

[env:esp32-s3-n16r8]
; 版本固定：換了 Arduino 核心，加密連線改用 PSRAM 的設定（lib/netupdate）可能就失效
platform = platformio/espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = app3M_fat9M_16MB.csv
build_flags =
  -DBOARD_HAS_PSRAM
  ; 公開發布的韌體不帶本機的家目錄路徑
  !echo "-ffile-prefix-map=$HOME=~"
  ; 版本號：建置時的 git commit，有還沒 commit 的變更時加上 -dirty
  !echo "-DFW_REV=\\\"$(git describe --always --dirty --abbrev=7)\\\""
monitor_speed = 115200
; 正體中文（原文）。其他語系見下方的環境，翻譯在 i18n/
custom_fw_lang = zh-TW
; 建置前產生韌體的字串表（make_i18n.py），把 panel.html 壓縮成各語系的 panel_gz*.h（make_panel.py）
extra_scripts =
  pre:tools/make_i18n.py
  pre:tools/make_panel.py
; 共用元件：網址更新（netupdate）、藍牙文字通道（phonelink）
lib_extra_dirs = ../lib
lib_deps =
  h2zero/NimBLE-Arduino@2.5.2
  olikraus/U8g2@2.36.18

; 簡體中文版：韌體字串與面板換成 i18n/ 的翻譯，從 esp32-tracker-zh-cn/ 更新
[env:esp32-s3-n16r8-zh-cn]
extends = env:esp32-s3-n16r8
custom_fw_lang = zh-CN
build_flags =
  ${env:esp32-s3-n16r8.build_flags}
  -DFW_LANG_ZH_CN

; 英文版：從 esp32-tracker-en/ 更新
[env:esp32-s3-n16r8-en]
extends = env:esp32-s3-n16r8
custom_fw_lang = en
build_flags =
  ${env:esp32-s3-n16r8.build_flags}
  -DFW_LANG_EN
