# 專案網頁 anoni.net/esp32/ 上的卡片與介紹頁（site/build.py 讀這份）。介紹頁的內文在 site.md。
name = "隨身偵測器"
order = 1
summary = "找出一直跟著你的 AirTag、SmartTag、Tile 與 DULT 追蹤器，也能檢查旅館房間的攝影機與會議室裡沒交出的手機。"
hardware = "ESP32-S3 N16R8 開發板，蜂鳴器與 OLED 選用"
# 正式通道在 assets.anoni.net 上的目錄，介紹頁與安裝頁寫出目前的版本
channel = "esp32-tracker"
# web：安裝頁用 ESP Web Tools 從網頁安裝。pio：只提供從原始碼建置
install = "web"

# 網頁安裝的韌體，每個語系一份：操作頁面的語言、按鈕上的名稱、正式通道在 assets.anoni.net 上的目錄。
# 只有一個語系時按鈕寫「接上開發板並安裝」，多個語系時每個語系一個按鈕。新增語系時韌體要另外建置並發布到
# 自己的通道（tools/publish_firmware.sh 的 publish.env），再加一段 [[firmware]]
[[firmware]]
lang = "zh-TW"
label = "正體中文"
channel = "esp32-tracker"

# 簡體中文與英文版：面板、藍牙文字通道與裝置的說明換成翻譯（pocket-detector/i18n/），OLED 三個語系都是英文
[[firmware]]
lang = "zh-CN"
label = "简体中文"
channel = "esp32-tracker-zh-cn"

[[firmware]]
lang = "en"
label = "English"
channel = "esp32-tracker-en"

[demo]
page = "pocket_detector/panel.html"
scenarios = "tests/panel/scenarios.py"

# OLED 的畫面（site.md 的 <!-- oled -->）。圖片在 site/oled/，由 oled demo 印出的緩衝區用
# tools/oled_to_png.py 轉成，用的是韌體裡寫死的假資料，不要換成 oled dump 的實際畫面
[[oled]]
file = "oled_normal.png"
caption = "平常：附近的追蹤器、訊號與出現比例"

[[oled]]
file = "oled_alert.png"
caption = "警示：第一列是觸發警示的追蹤器"

[[oled]]
file = "oled_find.png"
caption = "尋找：訊號越強，嗶聲越快"

[[oled]]
file = "oled_roomdone.png"
caption = "房間檢查完成：建議找出來與可以留意的數量"
