<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" role="img" aria-labelledby="t d">
  <title id="t">ESP32-S3 開發板的示意圖</title>
  <desc id="d">開發板下緣有兩個 USB-C 孔，絲印分別標 COM 與 USB，安裝韌體時把線接到標 COM 的孔。兩個孔旁邊各有一顆按鈕，BOOT 與 RST。</desc>
  <rect x="0" y="0" width="320" height="260" rx="12" fill="#f3f6f7"/>
  <!-- 板子 -->
  <rect x="85" y="18" width="150" height="196" rx="6" fill="#13232a"/>
  <g fill="#a7b5bb">
    <circle cx="96" cy="34" r="3"/><circle cx="96" cy="50" r="3"/><circle cx="96" cy="66" r="3"/><circle cx="96" cy="82" r="3"/><circle cx="96" cy="98" r="3"/><circle cx="96" cy="114" r="3"/><circle cx="96" cy="130" r="3"/><circle cx="96" cy="146" r="3"/><circle cx="96" cy="162" r="3"/>
    <circle cx="224" cy="34" r="3"/><circle cx="224" cy="50" r="3"/><circle cx="224" cy="66" r="3"/><circle cx="224" cy="82" r="3"/><circle cx="224" cy="98" r="3"/><circle cx="224" cy="114" r="3"/><circle cx="224" cy="130" r="3"/><circle cx="224" cy="146" r="3"/><circle cx="224" cy="162" r="3"/>
  </g>
  <!-- 模組 -->
  <rect x="118" y="30" width="84" height="88" rx="3" fill="#cdd6da"/>
  <text x="160" y="80" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#13232a">ESP32-S3</text>
  <!-- 按鈕 -->
  <rect x="112" y="160" width="20" height="14" rx="3" fill="#e3e9ec"/>
  <rect x="188" y="160" width="20" height="14" rx="3" fill="#e3e9ec"/>
  <!-- USB-C 孔 -->
  <rect x="117" y="200" width="30" height="16" rx="7" fill="#a7b5bb" stroke="#e3e9ec" stroke-width="2"/>
  <rect x="173" y="200" width="30" height="16" rx="7" fill="#a7b5bb" stroke="#e3e9ec" stroke-width="2"/>
  <!-- 標示 -->
  <g font-family="system-ui, -apple-system, 'PingFang TC', 'Noto Sans TC', sans-serif" font-size="14" fill="#13232a">
    <text x="40" y="171" text-anchor="middle">BOOT</text>
    <text x="280" y="171" text-anchor="middle">RST</text>
    <text x="60" y="246" text-anchor="middle" font-weight="700" fill="#006d99">COM 接這裡</text>
    <text x="252" y="246" text-anchor="middle">USB</text>
  </g>
  <g stroke="#52646b" stroke-width="1.5" fill="none">
    <path d="M62 167 H110"/>
    <path d="M258 167 H210"/>
    <path d="M132 218 L100 234"/>
    <path d="M188 218 L232 234"/>
  </g>
  <path d="M132 218 L100 234" stroke="#006d99" stroke-width="2.5" fill="none"/>
</svg>
