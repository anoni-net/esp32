# 專案網頁 anoni.net/esp32/ 與 esp32.<onion> 的 nginx 設定範本。主機上的實際設定分成三塊：
#   1. map 放在 conf.d/anoninet.conf 的最上面（http 層）
#   2. location 放進 anoni.net 的 server 區塊
#   3. onion 的 server 區塊
#   兩組標頭放在 snippets/esp32-headers.conf 與 snippets/esp32-frame-headers.conf
# 內容由 tools/deploy-m6.sh 建置到 /srv/anoni-net-esp32/current/。改了這份範本要同步到主機，
# 先備份、nginx -t 通過再 reload。

# ---- 1. http 層 ----
# 頁面與目錄送 no-cache，合併之後讀者不必等快取過期。no-transform 讓 Cloudflare 不注入
# Web Analytics 與 JS Detections 的 script（頁面的 CSP 也會擋下），也不改寫截圖
map $uri $esp32_cache_control {
    default                         "public, max-age=3600, no-transform";
    "~^(/esp32)?/(.*/)?$"           "no-cache, no-transform";
    "~^(/esp32)?/.*\.html$"         "no-cache, no-transform";
}

# ---- 2. anoni.net 的 server 區塊 ----
    location = /esp32 {
        return 301 https://$host/esp32/$is_args$args;
    }
    # 模擬面板：真正的面板網頁加上假資料，需要 inline script，CSP 另外一組，不能對外連線
    location ~ ^/esp32/(demo/[^/]+/frame/[^/]+\.html)$ {
        alias /srv/anoni-net-esp32/current/clearnet/$1;
        include /etc/nginx/snippets/esp32-frame-headers.conf;
    }
    location /esp32/ {
        alias /srv/anoni-net-esp32/current/clearnet/;
        index index.html;
        include /etc/nginx/snippets/esp32-headers.conf;
    }

# ---- 3. onion ----
server {
    listen unix:/var/run/tor-sitepad-anoni.sock;
    server_name esp32.anoninetru5tflukgfaehun7q6khowgmymcff3gtk5oyesqazhmfxtyd.onion;
    charset utf-8;
    root /srv/anoni-net-esp32/current/onion/;
    index index.html;
    location / {
        include /etc/nginx/snippets/esp32-headers.conf;
    }
    location ~ ^/demo/[^/]+/frame/[^/]+\.html$ {
        include /etc/nginx/snippets/esp32-frame-headers.conf;
    }
    gzip_comp_level 9;
    gzip_types *;
    access_log /var/log/nginx/access_anoni-net-esp32_onion.log main;
    error_log /var/log/nginx/error_anoni-net-esp32_onion.log;
}

# ---- snippets/esp32-headers.conf ----
# 介紹頁與安裝頁：只執行同站的 script（安裝頁的 ESP Web Tools，其他頁面沒有 script），只載入同站的
# 樣式與圖片，模擬面板的 iframe 也要同站。安裝頁從 assets.anoni.net 讀 manifest.json 與韌體
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src https://assets.anoni.net; frame-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cache-Control $esp32_cache_control always;

# ---- snippets/esp32-frame-headers.conf ----
# 模擬面板：面板網頁本身用 inline 的 script 與 style。sandbox 讓它就算被直接打開也是不透明的
# 來源，讀不到同站的 cookie 與儲存空間。connect-src 'none' 讓它不能對外連線
add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'; sandbox allow-scripts" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Robots-Tag "noindex" always;
add_header Cache-Control $esp32_cache_control always;
